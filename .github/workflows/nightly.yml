name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

# Least privilege: each job asks for what it needs. The job that runs the agent
# and patch code (stack) can only read.
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Runs the agent, patch code and builds. Read-only token; hands results to
  # `publish` as artifacts.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.meta.outputs.base_sha }}
      upstream_version: ${{ steps.meta.outputs.upstream_version }}
      gate_passed: ${{ steps.gate.outputs.passed }}
      # green | upstream red (tolerated) | patches red | upstream red | gate error
      verdict: ${{ steps.gate.outputs.verdict }}
    env:
      # Run in a source tree: once per patch by stack.sh, and as the gate's typecheck.
      VALIDATE_CMD: |
        for p in core cli tui; do (cd "packages/$p" && bun run typecheck) || exit 1; done
    steps:
      - name: Checkout fork (ci/)
        uses: actions/checkout@v4
        with:
          ref: fork
          path: ci
          persist-credentials: false

      - name: Checkout source (src/)
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false

      - name: Add upstream remote
        run: git -C src remote add upstream https://github.com/anomalyco/opencode.git

      - name: Require git >= 2.45
        run: |
          git --version
          v=$(git --version | awk '{print $3}')
          if [ "$(printf '%s\n%s\n' "$v" 2.45 | sort -V | head -n1)" != "2.45" ]; then
            echo "::error::git $v is older than 2.45 (stack.sh needs cherry-pick --empty=drop)"
            exit 1
          fi

      # src/ is an orphan-branch checkout without package.json; read the Bun version from upstream.
      - name: Resolve Bun version from upstream/dev
        id: bunver
        run: |
          git -C src fetch -q upstream dev
          bun=$(git -C src show FETCH_HEAD:package.json | jq -r '.packageManager | sub("^bun@"; "")')
          echo "Bun $bun"
          echo "version=$bun" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bunver.outputs.version }}

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify OpenCode
        run: opencode --version

      # The core tests need a system `rg`: the test preload blocks the ripgrep download.
      - name: Install ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          rg --version

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Stack patches onto upstream/dev
        id: stack
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_DISABLE_AUTOUPDATE: "1"
          # Only for stack.sh's merged-PR lookup; RESOLVE_CMD strips it before the agent starts.
          GH_TOKEN: ${{ github.token }}
          PREPARE_CMD: bun install --frozen-lockfile
          RESOLVE_CMD: |-
            env -u GH_TOKEN -u GITHUB_TOKEN timeout 20m opencode run --standalone --auto -m anthropic/claude-sonnet-5-5 "Branch: $PATCH_BRANCH. $(cat "$GITHUB_WORKSPACE/ci/prompts/resolve.md")"
        run: |
          # No stack-report.json on exit means the first PREPARE_CMD failed; the job fails here.
          ci/scripts/stack.sh src

      - name: Record base and upstream version
        id: meta
        run: |
          base=$(jq -r .base stack-report.json)
          version=$(git -C src show "$base:package.json" | jq -r .version)
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$version" >> "$GITHUB_OUTPUT"

      # Uploaded even on a red gate so `publish` can still sync patch-failure issues.
      - name: Upload stack report
        if: ${{ !cancelled() && hashFiles('stack-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: stack-report
          path: stack-report.json
          retention-days: 3
          overwrite: true

      # Gate: typecheck must pass. Core tests may fail only where the same tests also fail on the
      # upstream base commit ("no new failures vs upstream").
      - name: Gate (typecheck + core tests vs upstream)
        id: gate
        env:
          BASE_SHA: ${{ steps.meta.outputs.base_sha }}
        run: |
          set +e
          set -o pipefail
          out="$RUNNER_TEMP/gate"
          mkdir -p "$out"
          : >"$out/known-upstream-failures.txt"
          clean="$GITHUB_WORKSPACE/upstream-clean"

          finish() { # <passed> <verdict> <message>
            echo "passed=$1" >>"$GITHUB_OUTPUT"
            echo "verdict=$2" >>"$GITHUB_OUTPUT"
            cp "$out/known-upstream-failures.txt" "$GITHUB_WORKSPACE/known-upstream-failures.txt"
            printf '### Gate: %s\n\n%s\n' "$2" "$3" >>"$GITHUB_STEP_SUMMARY"
            if [ "$1" = true ]; then
              echo "Gate: $2"
              exit 0
            fi
            echo "::error::Gate: $2: ${3%%$'\n'*}"
            exit 1
          }

          setup_baseline() {
            [ -d "$clean" ] && return 0
            git -C src worktree add --detach "$clean" "$BASE_SHA" &&
              (cd "$clean" && bun install --frozen-lockfile)
          }

          # Failing tests as `file > name`, unique. bun prints `<path>:` at column 0 before a
          # file's results and `(fail) <name> [<time>]` per failing test (exact prefix only).
          fail_names() {
            awk '
              { sub(/\r$/, "") }
              /^[^[:space:]]+\.[cm]?[jt]sx?:$/ { file = substr($0, 1, length($0) - 1); next }
              /^\(fail\) / {
                name = substr($0, 8)
                sub(/ \[[^]]*\]$/, "", name)
                print (file != "" ? file " > " : "") name
              }' "$1" | LC_ALL=C sort -u
          }

          # Runs core tests in <dir>; log to <log>, failing names to <log>.fail. Sets RC, RAN (tests
          # run), ERR (bun's `N error(s)`: load errors and errors between tests, which print no
          # `(fail)` line). Returns 2 when there is no `Ran N tests` summary (crash).
          run_tests() { # <dir> <log>
            (cd "$1" && GITHUB_ACTIONS=false bun turbo test --force --log-prefix=none --filter=@opencode/core) 2>&1 | tee "$2"
            RC=${PIPESTATUS[0]}
            RAN=$(grep -aE '^Ran [0-9]+ tests? across [0-9]+ files?' "$2" | tail -n1 | sed -E 's/^Ran ([0-9]+) tests?.*/\1/')
            [ -n "$RAN" ] || return 2
            ERR=$(grep -aE '^ *[0-9]+ errors?\r?$' "$2" | tail -n1 | tr -dc '0-9')
            ERR=${ERR:-0}
            fail_names "$2" >"$2.fail"
            return 0
          }

          if ! (cd src && bash -c "$VALIDATE_CMD"); then
            # Typecheck never tolerates failures; the baseline only labels the cause.
            if setup_baseline && (cd "$clean" && bash -c "$VALIDATE_CMD"); then
              finish false "patches red" "Typecheck fails on the stack but passes on upstream."
            fi
            finish false "upstream red" "Typecheck fails on the stack and on upstream (or the baseline could not be set up)."
          fi

          run_tests src "$out/personal.log"
          if [ $? -eq 2 ]; then
            finish false "gate error" "Core tests on the stack printed no summary line (crash)."
          fi
          rc_p=$RC ran_p=$RAN err_p=$ERR
          if [ ! -s "$out/personal.log.fail" ]; then
            if [ "$err_p" -gt 0 ]; then
              finish false "patches red" "Core tests on the stack report $err_p error(s) (e.g. a test file that fails to load) and no failing test names."
            fi
            if [ "$rc_p" -ne 0 ]; then
              finish false "gate error" "Core tests on the stack exited $rc_p with no failing test and no error count."
            fi
            finish true green "Typecheck and core tests pass."
          fi

          if ! setup_baseline; then
            finish false "gate error" "Could not set up the upstream baseline checkout."
          fi
          run_tests "$clean" "$out/upstream.log"
          if [ $? -eq 2 ]; then
            finish false "gate error" "Core tests on upstream printed no summary line (crash)."
          fi
          if [ ! -s "$out/upstream.log.fail" ] && [ "$RC" -ne 0 ] && [ "$ERR" -eq 0 ]; then
            finish false "gate error" "Core tests on upstream exited $RC with no failing test and no error count."
          fi

          new=$(LC_ALL=C comm -23 "$out/personal.log.fail" "$out/upstream.log.fail")
          LC_ALL=C comm -12 "$out/personal.log.fail" "$out/upstream.log.fail" >"$out/known-upstream-failures.txt"
          if [ -n "$new" ]; then
            finish false "patches red" "$(printf 'Tests failing only on the stack:\n\n%s\n' "$new")"
          fi
          if [ "$err_p" -gt "$ERR" ]; then
            finish false "patches red" "The stack has more test errors than upstream ($err_p vs $ERR), e.g. a file that fails to load."
          fi
          if [ "$ran_p" -lt "$RAN" ]; then
            finish false "patches red" "The stack ran fewer tests than upstream ($ran_p vs $RAN)."
          fi
          inherited=$(wc -l <"$out/known-upstream-failures.txt" | tr -d ' ')
          if [ "$inherited" -gt 10 ]; then
            finish false "gate error" "upstream baseline too red to gate ($inherited failing tests inherited from upstream)."
          fi
          finish true "upstream red (tolerated)" "$(printf 'All failing tests also fail on upstream/dev:\n\n%s\n' "$(cat "$out/known-upstream-failures.txt")")"

      - name: Upload gate result
        uses: actions/upload-artifact@v4
        with:
          name: gate
          path: known-upstream-failures.txt
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      # Hidden dirs are skipped by upload-artifact, so ship the cache as a tarball.
      - name: Upload rerere cache
        run: tar -czf rr-cache.tgz -C ci .rr-cache

      - name: Upload rerere cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: rr-cache
          path: rr-cache.tgz
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Build opencode-darwin-arm64
        working-directory: src
        env:
          # Channel `latest` shares service.json, the default port and opencode.db with the official
          # desktop app, so the app and the fork TUI talk to one server.
          OPENCODE_CHANNEL: latest
          GH_TOKEN: ${{ github.token }}
          BUN_VERSION: ${{ steps.bunver.outputs.version }}
          UPSTREAM_VERSION: ${{ steps.meta.outputs.upstream_version }}
        run: |
          # Same version string as upstream's release: the official app and the fork then accept each
          # other's server instead of replacing it. The run number lives in the release tag only.
          export OPENCODE_VERSION="${UPSTREAM_VERSION}"
          export BUN_COMPILE_RELEASE="bun-v$BUN_VERSION"
          bun packages/cli/script/build.ts --target=opencode-darwin-arm64

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: opencode-darwin-arm64
          path: src/packages/cli/dist/cli-darwin-arm64/bin/opencode
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  # No agent, no patch code. Holds the write token: issues and .rr-cache pushes to `fork`.
  publish:
    needs: stack
    if: ${{ !cancelled() && needs.stack.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    outputs:
      fork_sha: ${{ steps.rrcache.outputs.fork_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout fork (ci/)
        uses: actions/checkout@v4
        with:
          ref: fork
          path: ci

      # `pattern` (unlike `name`) does not fail when the artifact was never uploaded.
      - name: Download stack report
        uses: actions/download-artifact@v4
        with:
          pattern: stack-report
          path: report
          merge-multiple: true

      - name: Download rerere cache
        uses: actions/download-artifact@v4
        with:
          pattern: rr-cache
          path: rr
          merge-multiple: true

      - name: Open and close patch-failure issues
        run: |
          set -euo pipefail
          report=report/stack-report.json
          if [ ! -f "$report" ]; then
            echo "No stack report; skipping issue sync."
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create patch-failure --color B60205 --description "Nightly fork automation failure" </dev/null 2>/dev/null || true
          open=$(gh issue list --label patch-failure --state open --limit 200 --json number,title </dev/null)
          while IFS=$'\t' read -r branch status detail; do
            title="patch failed: $branch"
            number=$(jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty' <<<"$open")
            case "$status" in
              failed)
                body=$(printf 'Patch %s failed to apply onto upstream/dev.\n\n%s\n\nRun: %s\n' "$branch" "$detail" "$run_url")
                if [ -n "$number" ]; then
                  gh issue edit "$number" --body "$body" </dev/null
                else
                  gh issue create --title "$title" --label patch-failure --body "$body" </dev/null
                fi
                ;;
              applied | resolved | merged | empty)
                if [ -n "$number" ]; then
                  gh issue close "$number" --comment "Patch is now \`$status\` ($run_url)." </dev/null
                fi
                ;;
            esac
          done < <(jq -r '.patches[] | [.branch, .status, .detail] | @tsv' "$report")
          # Branches dropped from patches.txt: close their leftover issues.
          while IFS=$'\t' read -r number branch; do
            gh issue close "$number" --comment "Branch is no longer in patches.txt ($run_url)." </dev/null
          done < <(jq -r --slurpfile r "$report" '
            ($r[0].patches | map(.branch)) as $known
            | .[] | select(.title | startswith("patch failed: "))
            | (.title | ltrimstr("patch failed: ")) as $b
            | select($known | index($b) | not)
            | [.number, $b] | @tsv' <<<"$open")

      # Gate passed: persist new rerere resolutions. Only .rr-cache is committed; no upstream commits are pushed.
      - name: Commit .rr-cache to fork
        id: rrcache
        working-directory: ci
        env:
          GATE_PASSED: ${{ needs.stack.outputs.gate_passed }}
        run: |
          set -euo pipefail
          if [ "$GATE_PASSED" = "true" ] && [ -f ../rr/rr-cache.tgz ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # The archive comes from the agent's job: accept only plain files and dirs under .rr-cache/.
            if ! tar -tzvf ../rr/rr-cache.tgz | awk '$1 !~ /^[-d]/ || $NF !~ /^\.rr-cache(\/|$)/ {bad=1} END {exit bad}'; then
              echo "::error::rr-cache archive has unexpected entries; not committing it"
              exit 1
            fi
            tar -xzf ../rr/rr-cache.tgz --no-same-owner
            git add -A .rr-cache
            if ! git diff --cached --quiet; then
              git commit -q -m "chore: update rerere cache"
              pushed=0
              for attempt in 1 2; do
                if git fetch -q origin fork && git rebase -q FETCH_HEAD && git push -q origin HEAD:refs/heads/fork; then
                  pushed=1
                  break
                fi
                echo "push attempt $attempt failed"
                git rebase --abort 2>/dev/null || true
                sleep 5
              done
              [ "$pushed" = 1 ] || { echo "::error::could not push .rr-cache to fork"; exit 1; }
            fi
          fi
          echo "fork_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: [stack, publish]
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    env:
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_CHANNEL_DB: "1"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opencode-darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: stack-report
      - uses: actions/download-artifact@v4
        with:
          name: gate

      - name: Sign and smoke test
        env:
          UPSTREAM_VERSION: ${{ needs.stack.outputs.upstream_version }}
        run: |
          set -euo pipefail
          chmod +x opencode
          codesign --force --sign - opencode
          codesign --verify --verbose opencode
          version=$(./opencode --version)
          echo "$version"
          case "$version" in
            *"${UPSTREAM_VERSION}"*) ;;
            *)
              echo "::error::expected ${UPSTREAM_VERSION} in --version output"
              exit 1
              ;;
          esac

      - name: Package and release
        env:
          FORK_SHA: ${{ needs.publish.outputs.fork_sha }}
          BASE_SHA: ${{ needs.stack.outputs.base_sha }}
          UPSTREAM_VERSION: ${{ needs.stack.outputs.upstream_version }}
          VERDICT: ${{ needs.stack.outputs.verdict }}
        run: |
          set -euo pipefail
          tag="v${UPSTREAM_VERSION}-jjj.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          tar -czf opencode-darwin-arm64.tar.gz opencode
          {
            echo "Upstream: anomalyco/opencode@$BASE_SHA"
            echo
            echo "| patch | status | source |"
            echo "| --- | --- | --- |"
            jq -r '.patches[] | "| `\(.branch)` | \(.status) | \(.source // "-") |"' stack-report.json
            echo
            echo "Gate: $VERDICT"
            if [ -s known-upstream-failures.txt ]; then
              echo
              echo "### Known upstream failures"
              echo
              echo "These tests also fail on upstream/dev at the base commit; the gate tolerated them."
              echo
              while IFS= read -r name; do printf -- '- \x60%s\x60\n' "$name"; done <known-upstream-failures.txt
            fi
          } >notes.md
          gh release create "$tag" opencode-darwin-arm64.tar.gz \
            --target "$FORK_SHA" \
            --title "$tag" \
            --latest \
            --notes-file notes.md
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Close "nightly failed" issue
        run: |
          set -euo pipefail
          release_url=$(gh release view "$TAG" --json url --jq .url)
          number=$(gh issue list --label patch-failure --state open --limit 200 --json number,title \
            | jq -r '[.[] | select(.title == "nightly failed")][0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Fixed by release $release_url"
          fi

  notify:
    needs: [stack, publish, release]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update "nightly failed" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STACK_RESULT: ${{ needs.stack.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          VERDICT: ${{ needs.stack.outputs.verdict }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          title="nightly failed"
          body=$(printf 'Nightly run failed: %s\n\nstack: %s\npublish: %s\nrelease: %s\ngate verdict: %s\n' \
            "$run_url" "$STACK_RESULT" "$PUBLISH_RESULT" "$RELEASE_RESULT" "${VERDICT:-n/a}")
          gh label create patch-failure --color B60205 --description "Nightly fork automation failure" 2>/dev/null || true
          number=$(gh issue list --label patch-failure --state open --limit 200 --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$title" --label patch-failure --body "$body"
          fi
